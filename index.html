<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Layering</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      padding: 2rem 0;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 1.5rem;
    }

    /* ── Ring visualization with the record button in the hub ── */
    #viz-area {
      width: min(380px, calc(100vw - 3rem));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    #viz-wrap {
      position: relative;
      width: 100%;
    }

    #viz-canvas {
      width: 100%;
      aspect-ratio: 1;
      display: block;
    }

    /* ── Record button (sits in the hub, centre of the rings) ── */
    #record-btn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 26.5%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid #444;
      background: #1a1a22;
      color: #e0e0e0;
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      -webkit-tap-highlight-color: transparent;
      padding: 0.3rem;
      text-align: center;
      line-height: 1.25;
    }

    #record-btn:hover:not(:disabled) {
      border-color: #666;
    }

    #record-btn.recording {
      border-color: #e03a3a;
      background: #221a1a;
    }

    /* Pulsing ring while recording */
    #record-btn.recording::before {
      content: "";
      position: absolute;
      inset: -9px;
      border-radius: 50%;
      border: 2px solid #e03a3a;
      animation: pulse 1.2s ease-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%   { opacity: 0.8; transform: scale(1); }
      100% { opacity: 0;   transform: scale(1.3); }
    }

    .btn-icon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #555;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    #record-btn.recording .btn-icon {
      background: #e03a3a;
      border-radius: 3px; /* square = recording indicator */
      width: 13px;
      height: 13px;
    }

    #record-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Mixer (collapsible) ── */
    #mixer-details {
      display: none;
      width: 100%;
      max-width: 300px;
    }

    #mixer-details.visible { display: block; }

    #mixer-summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      cursor: pointer;
      font-size: 0.72rem;
      color: #888;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.5rem 0.75rem;
      border: 1px solid #333;
      border-radius: 6px;
      transition: border-color 0.15s, color 0.15s;
    }

    #mixer-summary::-webkit-details-marker { display: none; }

    #mixer-summary:hover {
      border-color: #555;
      color: #bbb;
    }

    #mixer-summary::after {
      content: "▾";
      font-size: 0.8em;
      transition: transform 0.15s;
    }

    #mixer-details[open] #mixer-summary::after { transform: rotate(180deg); }

    #master-row {
      margin-top: 0.7rem;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid #26262f;
    }

    #mixer {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      width: 100%;
      margin-top: 0.55rem;
    }

    .mix-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.72rem;
      color: #888;
    }

    .mix-row .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .mix-label {
      width: 4.2em;
      flex-shrink: 0;
    }

    .mix-row input[type="range"] {
      flex: 1;
      cursor: pointer;
      min-width: 0;
    }

    .mix-val {
      width: 3.2em;
      text-align: right;
      color: #666;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    #mixer-hint {
      margin-top: 0.55rem;
      font-size: 0.66rem;
      color: #444;
      letter-spacing: 0.03em;
      text-align: center;
    }

    /* ── Status area ── */
    #status-area {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      min-height: 3rem;
    }

    #layer-count {
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 0.05em;
    }

    #layer-count span {
      color: #e0e0e0;
      font-weight: 600;
    }

    #status-msg {
      font-size: 0.8rem;
      color: #555;
      letter-spacing: 0.05em;
      min-height: 1.1em;
    }

    #status-msg.active {
      color: #e03a3a;
    }

    /* ── Secondary controls (pause / reset) ── */
    #secondary-controls {
      margin-top: 1.5rem;
      display: none;
      gap: 0.75rem;
    }

    .ctrl-btn {
      padding: 0.65rem 1.4rem;
      border: 1px solid #444;
      border-radius: 6px;
      background: transparent;
      color: #aaa;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    #pause-btn:hover {
      border-color: #f7c44a;
      color: #f7c44a;
      background: rgba(247, 196, 74, 0.06);
    }

    #pause-btn.paused {
      border-color: #f7c44a;
      color: #f7c44a;
    }

    #reset-btn:hover {
      border-color: #e03a3a;
      color: #e03a3a;
      background: rgba(224, 58, 58, 0.06);
    }

    /* ── Download button ── */
    #download-btn {
      margin-top: 0.75rem;
      padding: 0.65rem 1.6rem;
      border: 1px solid #444;
      border-radius: 6px;
      background: transparent;
      color: #aaa;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      display: none;
    }

    #download-btn:hover {
      border-color: #4a8cf7;
      color: #4a8cf7;
      background: rgba(74, 140, 247, 0.06);
    }

    /* ── Latency / timing offset control ── */
    #latency-control {
      margin-top: 1.75rem;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
    }

    #latency-control label {
      font-size: 0.72rem;
      color: #555;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .latency-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .latency-edge {
      font-size: 0.7rem;
      color: #444;
      width: 3em;
    }

    .latency-edge:last-of-type { text-align: right; }

    #latency-slider {
      width: 150px;
      accent-color: #4a8cf7;
      cursor: pointer;
    }

    #latency-val {
      font-size: 0.78rem;
      color: #888;
      min-width: 4.5em;
      text-align: center;
    }

    /* ── Settings + History ── */
    #settings-btn, #history-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid #333;
      background: #16161d;
      color: #777;
      font-size: 1.05rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      z-index: 10;
    }

    #history-btn { right: 3.7rem; }

    #settings-btn:hover, #history-btn:hover {
      border-color: #555;
      color: #bbb;
    }

    #settings-panel {
      position: fixed;
      top: 3.6rem;
      right: 1rem;
      width: min(280px, calc(100vw - 2rem));
      background: #1a1a24;
      border: 1px solid #33334a;
      border-radius: 10px;
      padding: 1rem;
      display: none;
      z-index: 10;
    }

    #settings-panel.open { display: block; }

    #settings-panel h2 {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 0.8rem;
    }

    .setting-row {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      cursor: pointer;
      font-size: 0.8rem;
      color: #ccc;
      line-height: 1.35;
    }

    .setting-row + .setting-row { margin-top: 0.9rem; }

    .setting-row input[type="checkbox"] {
      margin-top: 0.15em;
      accent-color: #4a8cf7;
      cursor: pointer;
      flex-shrink: 0;
    }

    .setting-row small {
      display: block;
      margin-top: 0.25rem;
      font-size: 0.68rem;
      color: #666;
    }

    /* ── History panel ── */
    #history-panel {
      position: fixed;
      top: 3.6rem;
      right: 1rem;
      width: min(320px, calc(100vw - 2rem));
      max-height: min(70vh, 420px);
      overflow-y: auto;
      background: #1a1a24;
      border: 1px solid #33334a;
      border-radius: 10px;
      padding: 1rem;
      display: none;
      z-index: 10;
    }

    #history-panel.open { display: block; }

    #history-panel h2 {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 0.5rem;
    }

    .hist-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid #26262f;
    }

    .hist-row:last-child { border-bottom: none; }

    .hist-main {
      flex: 1;
      min-width: 0;
    }

    .hist-name {
      font-size: 0.8rem;
      color: #ddd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hist-meta {
      font-size: 0.65rem;
      color: #666;
      margin-top: 0.15rem;
    }

    .hist-act {
      background: none;
      border: 1px solid #3a3a50;
      border-radius: 5px;
      color: #999;
      font-size: 0.68rem;
      padding: 0.3rem 0.5rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
      font-family: inherit;
    }

    .hist-act:hover {
      border-color: #4a8cf7;
      color: #cfe0ff;
    }

    .hist-del:hover {
      border-color: #e03a3a;
      color: #e03a3a;
    }

    .hist-rename {
      width: 100%;
      background: #12121a;
      border: 1px solid #4a8cf7;
      border-radius: 4px;
      color: #ddd;
      font-size: 0.8rem;
      padding: 0.2rem 0.4rem;
      outline: none;
      font-family: inherit;
    }

    .hist-empty {
      font-size: 0.75rem;
      color: #666;
      text-align: center;
      padding: 0.5rem 0;
    }

    /* ── Export dialog ── */
    #export-dialog {
      position: fixed;
      inset: 0;
      background: rgba(8, 8, 12, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 1rem;
    }

    #export-dialog.open { display: flex; }

    #export-card {
      background: #1a1a24;
      border: 1px solid #33334a;
      border-radius: 10px;
      padding: 1.2rem;
      width: min(320px, 100%);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    #export-card h2 {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 0.2rem;
    }

    #export-name {
      width: 100%;
      background: #12121a;
      border: 1px solid #3a3a50;
      border-radius: 6px;
      color: #ddd;
      font-size: 0.8rem;
      padding: 0.55rem 0.7rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    #export-name:focus { border-color: #4a8cf7; }

    #export-name::placeholder { color: #555; }

    .export-opt {
      border: 1px solid #3a3a50;
      border-radius: 8px;
      background: #20202c;
      color: #ddd;
      padding: 0.8rem 1rem;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      transition: border-color 0.15s, background 0.15s;
      font-family: inherit;
    }

    .export-opt:hover:not(:disabled) {
      border-color: #4a8cf7;
      background: #222534;
    }

    .export-opt:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .export-opt strong {
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .export-opt small {
      font-size: 0.68rem;
      color: #777;
      line-height: 1.4;
    }

    #export-cancel {
      align-self: center;
      background: none;
      border: none;
      color: #666;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.3rem 0.8rem;
      transition: color 0.15s;
    }

    #export-cancel:hover { color: #aaa; }

    /* ── Headphone warning banner ── */
    #headphone-warning {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e28;
      border: 1px solid #3a3a50;
      border-radius: 8px;
      padding: 0.8rem 1.2rem;
      font-size: 0.78rem;
      color: #999;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      max-width: 340px;
      width: calc(100% - 2rem);
      line-height: 1.4;
    }

    #headphone-warning .icon { font-size: 1.2rem; flex-shrink: 0; }

    #dismiss-warning {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0 0 0 0.5rem;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    #dismiss-warning:hover { color: #999; }

    #version {
      position: fixed;
      bottom: 0.6rem;
      right: 0.8rem;
      font-size: 0.65rem;
      color: #333;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <h1>Audio Layering</h1>

  <button id="history-btn" aria-label="History">🕘</button>
  <div id="history-panel">
    <h2>History</h2>
    <div id="history-list"></div>
  </div>

  <button id="settings-btn" aria-label="Settings">⚙</button>
  <div id="settings-panel">
    <h2>Settings</h2>
    <label class="setting-row">
      <input type="checkbox" id="ptt-toggle" />
      <span>
        Push to talk
        <small>Hold the button to record a layer, release to stop. When off, tap once and
        keep going — every loop of audio with enough sound in it becomes a new layer
        automatically.</small>
      </span>
    </label>
    <label class="setting-row">
      <input type="checkbox" id="raw-mic-toggle" />
      <span>
        Raw mic (studio)
        <small>Disables echo cancellation, noise suppression, and auto gain for
        faithful instrument capture. Voice usually sounds better with this off.
        Takes effect on the next recording.</small>
      </span>
    </label>
  </div>

  <div id="viz-area">
    <div id="viz-wrap">
      <canvas id="viz-canvas"></canvas>
      <button id="record-btn" disabled>
        <div class="btn-icon"></div>
        <span id="btn-label">Tap to Record</span>
      </button>
    </div>
    <details id="mixer-details">
      <summary id="mixer-summary">Layer Volumes</summary>
      <div class="mix-row" id="master-row">
        <div class="legend-dot" style="background:#e0e0e0"></div>
        <span class="mix-label">Max</span>
        <input type="range" id="master-slider" min="0" max="100" value="50" style="accent-color:#e0e0e0" />
        <span class="mix-val" id="master-val">50%</span>
      </div>
      <div id="mixer"></div>
      <div id="mixer-hint">Older layers duck automatically · sliders set each layer's own level</div>
    </details>
  </div>

  <div id="status-area">
    <div id="layer-count" style="display:none">
      Layers: <span id="layer-num">0</span>
      &nbsp;·&nbsp; Loop: <span id="loop-dur">0.0</span>s
    </div>
    <div id="status-msg">Initializing…</div>
  </div>

  <div id="secondary-controls">
    <button id="pause-btn" class="ctrl-btn">⏸ Pause</button>
    <button id="reset-btn" class="ctrl-btn">↺ Reset</button>
  </div>

  <button id="download-btn">&#8659; Download WAV</button>

  <div id="latency-control">
    <label for="latency-slider">Timing Offset</label>
    <div class="latency-row">
      <span class="latency-edge">-300ms</span>
      <input id="latency-slider" type="range" min="-300" max="300" step="5" value="0" />
      <span class="latency-edge">+300ms</span>
    </div>
    <span id="latency-val">0 ms</span>
  </div>

  <div id="export-dialog">
    <div id="export-card">
      <h2>Export</h2>
      <input type="text" id="export-name" placeholder="Name this recording" maxlength="60" />
      <button class="export-opt" id="export-final">
        <strong>End Result</strong>
        <small id="export-final-desc">The finished loop as it sounds now</small>
      </button>
      <button class="export-opt" id="export-journey">
        <strong>Journey</strong>
        <small id="export-journey-desc">The process — one loop per layer, arriving one at a time</small>
      </button>
      <button id="export-cancel">Cancel</button>
    </div>
  </div>

  <div id="version">v1.4.2</div>

  <div id="headphone-warning">
    <span class="icon">🎧</span>
    <span>Use headphones to prevent playback from bleeding into your recording.</span>
    <button id="dismiss-warning" aria-label="Dismiss">✕</button>
  </div>

  <script>
  (() => {
    const TAU = Math.PI * 2;

    // ── DOM refs ──────────────────────────────────────────────────────────
    const recordBtn      = document.getElementById('record-btn');
    const btnLabel       = document.getElementById('btn-label');
    const statusMsg      = document.getElementById('status-msg');
    const layerCountEl   = document.getElementById('layer-count');
    const layerNumEl     = document.getElementById('layer-num');
    const loopDurEl      = document.getElementById('loop-dur');
    const downloadBtn       = document.getElementById('download-btn');
    const secondaryControls = document.getElementById('secondary-controls');
    const pauseBtn          = document.getElementById('pause-btn');
    const resetBtn          = document.getElementById('reset-btn');
    const vizCanvas         = document.getElementById('viz-canvas');
    const mixerEl           = document.getElementById('mixer');
    const mixerDetails      = document.getElementById('mixer-details');
    const mixerSummary      = document.getElementById('mixer-summary');
    const masterSlider      = document.getElementById('master-slider');
    const masterVal         = document.getElementById('master-val');
    const latencyControl    = document.getElementById('latency-control');
    const latencySlider     = document.getElementById('latency-slider');
    const latencyVal        = document.getElementById('latency-val');
    const exportDialog      = document.getElementById('export-dialog');
    const exportFinalBtn    = document.getElementById('export-final');
    const exportJourneyBtn  = document.getElementById('export-journey');
    const exportFinalDesc   = document.getElementById('export-final-desc');
    const exportJourneyDesc = document.getElementById('export-journey-desc');
    const exportCancel      = document.getElementById('export-cancel');
    const exportName        = document.getElementById('export-name');
    const settingsBtn       = document.getElementById('settings-btn');
    const settingsPanel     = document.getElementById('settings-panel');
    const pttToggle         = document.getElementById('ptt-toggle');
    const rawMicToggle      = document.getElementById('raw-mic-toggle');
    const historyBtn        = document.getElementById('history-btn');
    const historyPanel      = document.getElementById('history-panel');
    const historyList       = document.getElementById('history-list');
    const headphoneWarn     = document.getElementById('headphone-warning');
    const dismissWarning    = document.getElementById('dismiss-warning');

    // ── Settings ──────────────────────────────────────────────────────────
    const LS_PTT = 'audioLayering.pushToTalk';
    let pushToTalk = localStorage.getItem(LS_PTT) === '1';

    // Voice processing (echo cancellation, noise suppression, auto gain) is ON
    // by default — it keeps speech loud and clean. Raw mode is for capturing
    // instruments faithfully.
    const LS_RAW = 'audioLayering.rawMic';
    let rawMic = localStorage.getItem(LS_RAW) === '1';
    let micRefreshPending = false; // constraints changed while a recorder was live

    // ── History persistence (IndexedDB) ───────────────────────────────────
    // Each session (one loop + its layers) is auto-saved as layers arrive, so
    // past recordings survive Reset and page reloads. Layers are stored as
    // their original encoded blobs plus the metadata needed to rebuild them.
    let currentSessionId = null;
    let sessionName      = '';
    let dbPromise        = null;

    function openDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open('audioLayering', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('sessions', { keyPath: 'id' });
          req.onsuccess = () => resolve(req.result);
          req.onerror   = () => reject(req.error);
        });
      }
      return dbPromise;
    }

    async function idbPut(record) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('sessions', 'readwrite');
        tx.objectStore('sessions').put(record);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbAll() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction('sessions').objectStore('sessions').getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
      });
    }

    async function idbDelete(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('sessions', 'readwrite');
        tx.objectStore('sessions').delete(id);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function saveSession() {
      if (!layers.length || !loopLength) return;
      if (!currentSessionId) {
        currentSessionId = 'S' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      }
      const record = {
        id: currentSessionId,
        name: sessionName,
        updatedAt: Date.now(),
        loopLength,
        layers: layers.map(l => ({
          blob: l.blob,
          rawOffset: l.rawOffset,
          compensate: l.compensate,
          effVol: l.effVol,
        })),
      };
      try {
        await idbPut(record);
      } catch (err) {
        console.error('History save failed', err);
      }
    }

    // ── Audio state ───────────────────────────────────────────────────────
    let audioCtx        = null;
    let mediaStream     = null;
    let mediaRecorder   = null;

    // Each layer: { buffer, rawOffset, offset, compensate, gain, effVol,
    //               peaks, peakMax, curR, curHalf, valEl, sliderEl }
    const layers = [];

    // Playback loop state. The loop length is fixed by the FIRST recording;
    // later layers wrap around the loop boundary instead of extending it.
    let loopLength          = 0;       // seconds
    let loopStartAudioTime  = null;    // AudioContext time when current iteration began
    let nextLoopTimeout     = null;

    // Flag: we're mid-decode after a manual recording stops
    let isDecoding = false;

    // Flag: user released the button before async setup finished
    let startAborted = false;

    // Continuous (toggle) recording: after the first layer, keep recording in
    // loop-length segments; each segment with enough sound becomes a layer.
    let autoRec          = false;
    let segmentTimer     = null;
    let currentSegOffset = 0;

    // Live mic level monitor. Segment boundaries fall wherever the timer fires
    // — usually mid-loop — so cutting blindly truncates whatever is being said
    // right then. We watch the mic and only cut once it's been quiet a moment.
    let micAnalyser = null;
    let micData     = null;
    let lastLoudAt  = 0; // performance.now() of the last loud mic sample

    // Waveform colours per layer
    const LAYER_COLORS = ['#4a8cf7', '#f7c44a', '#4af7a0', '#f74a8c', '#a44af7', '#f7714a'];

    // Latency compensation
    let manualLatencyMs = 0;

    // Max (master) volume: slider 0..100, default 50 = the pre-slider loudness.
    let masterVol  = 0.5;
    let masterGain = null;

    // Pause state
    let isPaused       = false;
    let pausedOffset   = 0; // loop position (seconds) when paused

    // Recording indicator state for the visualization
    let isRecording  = false;
    let recStartTime = 0; // AudioContext time recording began

    // All live AudioBufferSourceNodes so we can stop them on reset
    let activeNodes = [];

    // ── Init ──────────────────────────────────────────────────────────────
    function init() {
      // Check basic browser support — everything else is set up lazily on first press
      // so the AudioContext is created inside a user gesture (required on mobile).
      if (!navigator.mediaDevices || !window.AudioContext && !window.webkitAudioContext) {
        setStatus('Your browser does not support Web Audio. Try Chrome or Safari.');
        return;
      }
      pttToggle.checked = pushToTalk;
      rawMicToggle.checked = rawMic;
      recordBtn.disabled = false;
      updateIdleLabel();
      setStatus(pushToTalk
        ? 'Hold the button to record your first layer'
        : 'Tap the button to record your first layer');
      startViz();
    }

    function updateIdleLabel() {
      btnLabel.textContent = pushToTalk ? 'Hold to Record' : 'Tap to Record';
    }

    // Creates the AudioContext (and master gain) the first time, always inside
    // a user-gesture handler so mobile browsers allow it. Playback-only paths
    // (loading from history) use this without touching the microphone.
    async function ensureCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (!masterGain) {
        masterGain = audioCtx.createGain();
        masterGain.gain.value = masterFactor();
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
    }

    async function ensureReady() {
      await ensureCtx();
      if (!mediaStream) {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: rawMic
            ? { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            : { echoCancellation: true,  noiseSuppression: true,  autoGainControl: true },
          video: false
        });
      }
      if (!micAnalyser) {
        const src = audioCtx.createMediaStreamSource(mediaStream);
        micAnalyser = audioCtx.createAnalyser();
        micAnalyser.fftSize = 512;
        micData = new Float32Array(micAnalyser.fftSize);
        src.connect(micAnalyser); // analysis only — never routed to the output
      }
    }

    // Normalise a time delta into [0, loopLength). The next-iteration timer fires
    // ~50ms early, so (now - loopStartAudioTime) can be briefly negative.
    function normOffset(x) {
      return ((x % loopLength) + loopLength) % loopLength;
    }

    function currentLoopOffset() {
      if (!loopLength) return 0;
      if (isPaused) return pausedOffset;
      return normOffset(audioCtx.currentTime - loopStartAudioTime);
    }

    function makeRecorder() {
      const mimeType = getSupportedMimeType();
      const opts = { audioBitsPerSecond: 128000 }; // don't rely on browser default quality
      if (mimeType) opts.mimeType = mimeType;
      const rec = new MediaRecorder(mediaStream, opts);
      rec.chunks = [];
      rec.ondataavailable = e => { if (e.data.size > 0) rec.chunks.push(e.data); };
      return rec;
    }

    // Release the mic so the next recording re-acquires it with the current
    // constraints (used when the raw-mic setting changes).
    function dropMicStream() {
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
      micAnalyser = null;
      micData     = null;
    }

    // Safe point to apply a pending mic-constraint change: only when no
    // recorder is live (stopping tracks under an active recorder loses audio).
    function refreshMicIfPending() {
      if (!micRefreshPending) return;
      if (mediaRecorder && mediaRecorder.state !== 'inactive') return;
      micRefreshPending = false;
      dropMicStream();
    }

    // ── Recording (manual: first layer, and every layer in push-to-talk) ──
    let recordingStartOffset = 0; // loop offset (seconds) at which recording began

    async function startRecording() {
      if (isDecoding) return;
      startAborted = false;
      refreshMicIfPending();

      // Set up AudioContext + mic inside the user gesture so mobile allows it.
      try {
        await ensureReady();
      } catch (err) {
        setStatus('Microphone access denied. Check permissions and try again.');
        console.error(err);
        return;
      }

      // User may have released the button while we were awaiting permissions.
      if (startAborted) return;

      // Capture offset within the current loop
      recordingStartOffset = loopLength > 0
        ? normOffset(audioCtx.currentTime - loopStartAudioTime)
        : 0;
      recStartTime = audioCtx.currentTime;

      mediaRecorder = makeRecorder();
      mediaRecorder.start();
      isRecording = true;

      recordBtn.classList.add('recording');
      btnLabel.textContent = pushToTalk ? 'Recording…' : 'Tap to Stop';
      setStatus('Recording', true);
    }

    function stopRecording() {
      startAborted = true; // signal startRecording to bail if still in async setup
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
      isRecording = false;

      recordBtn.classList.remove('recording');
      btnLabel.textContent = 'Processing…';
      recordBtn.disabled = true;
      setStatus('Processing…');
      isDecoding = true;

      const rec = mediaRecorder;
      const rawOffset = recordingStartOffset;
      rec.onstop = async () => {
        const ok = await commitRecording(rec, rawOffset, false);
        isDecoding = false;
        recordBtn.disabled = false;
        updateIdleLabel();
        if (ok) {
          if (!pushToTalk && !isPaused) {
            // Toggle mode: keep listening — new layers are added automatically.
            startAutoSegments();
          } else {
            setStatus('Playing — hold to add another layer');
          }
        }
      };

      rec.stop();
    }

    // Decode a finished recording and add it as a layer. Auto-recorded segments
    // are only kept if they contain enough sound (i.e. the user actually spoke).
    async function commitRecording(rec, rawOffset, auto) {
      try {
        const blob        = new Blob(rec.chunks, { type: rec.mimeType });
        const arrayBuf    = await blob.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuf);

        if (auto && !hasEnoughSound(audioBuffer)) {
          if (autoRec) setStatus('Too quiet — skipped. Listening…', true);
          return false;
        }

        // Store raw offset; compensation is applied dynamically so the slider works in real time.
        // compensate=true for all layers except the first (which has no reference to sync against).
        const shouldCompensate = loopLength > 0;
        const offset = shouldCompensate ? applyCompensation(rawOffset) : 0;

        const gain = audioCtx.createGain();
        gain.connect(masterGain);

        const layer = {
          buffer: audioBuffer,
          blob,
          rawOffset,
          offset,
          compensate: shouldCompensate,
          gain,
          effVol: 1,
          peaks: null,
          peakMax: 0,
          curR: null,
          curHalf: 0,
          valEl: null,
          sliderEl: null,
        };
        layers.push(layer);

        if (loopLength === 0) {
          // First layer — it defines the loop length for the whole session.
          loopLength = audioBuffer.duration;
          updateLayerUI();
          startLoopIteration(audioCtx.currentTime);
        } else {
          updateLayerUI();
          // Schedule the new layer's remaining segments in the current iteration.
          const curOff = currentLoopOffset();
          scheduleLayerFrom(layer, audioCtx.currentTime - curOff, curOff);
        }

        saveSession();

        if (auto && autoRec) setStatus('Layer ' + layers.length + ' added — listening…', true);
        return true;
      } catch (err) {
        console.error(err);
        if (auto) {
          if (autoRec) setStatus('Listening — speak to add a layer', true);
        } else {
          setStatus('Error processing audio. Try again.');
        }
        return false;
      } finally {
        refreshMicIfPending();
      }
    }

    // Does the buffer contain actual speech/sound, not just room noise?
    // Adaptive: the threshold sits 3× above the segment's own noise floor
    // (20th-percentile block RMS), clamped so a quiet mic still registers
    // (floor 0.006) and wall-to-wall loud speech can't out-shout itself into
    // rejection (cap 0.04). Requires ≥3 blocks (~150ms) above threshold, so a
    // single click or pop doesn't count.
    function hasEnoughSound(buffer) {
      const data  = buffer.getChannelData(0);
      const block = Math.max(1, Math.floor(buffer.sampleRate * 0.05));
      const rms = [];
      for (let i = 0; i + block <= data.length; i += block) {
        let sum = 0;
        for (let j = i; j < i + block; j++) sum += data[j] * data[j];
        rms.push(Math.sqrt(sum / block));
      }
      if (rms.length < 3) return false;
      const sorted = rms.slice().sort((a, b) => a - b);
      const noiseFloor = sorted[Math.floor(sorted.length * 0.2)];
      const threshold = Math.min(0.04, Math.max(0.006, noiseFloor * 3));
      let loud = 0;
      for (const v of rms) {
        if (v > threshold) {
          loud++;
          if (loud >= 3) return true;
        }
      }
      return false;
    }

    // ── Continuous (toggle-mode) recording ────────────────────────────────
    // After the first layer, keep the mic rolling: record loop-length segments
    // back to back, committing each one that passes the sound check.

    async function startAutoSegments() {
      if (autoRec || !loopLength) return;
      refreshMicIfPending();
      try {
        await ensureReady();
      } catch (err) {
        setStatus('Microphone access denied. Check permissions and try again.');
        console.error(err);
        return;
      }
      autoRec = true;
      recordBtn.classList.add('recording');
      btnLabel.textContent = 'Tap to Stop';
      setStatus('Listening — speak to add a layer', true);
      beginSegment();
    }

    function beginSegment() {
      currentSegOffset = normOffset(audioCtx.currentTime - loopStartAudioTime);
      recordingStartOffset = currentSegOffset; // drives the recording arc in the viz
      recStartTime = audioCtx.currentTime;
      mediaRecorder = makeRecorder();
      mediaRecorder.start();
      isRecording = true;
      clearTimeout(segmentTimer);
      segmentTimer = setTimeout(() => {
        if (autoRec) tryFinishSegment(performance.now() + Math.min(3000, loopLength * 1000));
      }, loopLength * 1000);
    }

    // Cut the segment only once the mic has been quiet for a beat, so a sound
    // straddling the (invisible, mid-loop) segment boundary isn't chopped. The
    // deadline caps the extension; an over-long segment is safe — layers longer
    // than the loop simply wrap and overlay themselves.
    const QUIET_HOLD_MS = 200;

    function tryFinishSegment(deadline) {
      if (!autoRec) return;
      const now = performance.now();
      if (now - lastLoudAt < QUIET_HOLD_MS && now < deadline) {
        segmentTimer = setTimeout(() => tryFinishSegment(deadline), 120);
        return;
      }
      finishSegment(true);
    }

    function finishSegment(restart) {
      clearTimeout(segmentTimer);
      const rec = mediaRecorder;
      const segOffset = currentSegOffset;
      if (rec && rec.state !== 'inactive') {
        rec.onstop = () => commitRecording(rec, segOffset, true);
        rec.stop();
      }
      if (restart && autoRec) {
        beginSegment();
      } else {
        isRecording = false;
      }
    }

    // Stop continuous recording. The in-progress segment is committed (it still
    // has to pass the sound check) so a tap right after speaking keeps the words.
    function stopAutoSegments(commitPartial) {
      if (!autoRec) return;
      autoRec = false;
      clearTimeout(segmentTimer);
      const rec = mediaRecorder;
      if (rec && rec.state !== 'inactive') {
        if (commitPartial) {
          const segOffset = currentSegOffset;
          rec.onstop = () => commitRecording(rec, segOffset, true);
        } else {
          rec.onstop = null; // discard
        }
        rec.stop();
      }
      isRecording = false;
      recordBtn.classList.remove('recording');
      updateIdleLabel();
      setStatus('Playing — tap to record more');
    }

    // ── Latency helpers ───────────────────────────────────────────────────

    function applyCompensation(rawOffset) {
      const autoLatency = (audioCtx.baseLatency || 0) + (audioCtx.outputLatency || 0);
      const total = autoLatency + manualLatencyMs / 1000;
      return rawOffset - total; // may be negative; callers handle trimming
    }

    function reapplyLatencyAndRestart() {
      if (!loopLength || isPaused) return;

      // Recompute offsets for all compensated layers
      layers.forEach(layer => {
        if (layer.compensate) layer.offset = applyCompensation(layer.rawOffset);
      });

      // Stop everything and restart from the current loop position; layers that
      // are mid-play resume from partway through their buffers.
      stopAllNodes();
      clearTimeout(nextLoopTimeout);

      const curOff = currentLoopOffset();
      loopStartAudioTime = audioCtx.currentTime - curOff;
      scheduleIterationFrom(loopStartAudioTime, curOff);
      scheduleNextIteration(loopStartAudioTime);
    }

    // ── Playback loop scheduler ───────────────────────────────────────────
    // A layer is laid onto the loop timeline starting at its offset; whenever
    // the recording runs past the loop boundary, the remainder wraps back to
    // the start as a new pass. A layer longer than the loop therefore overlays
    // itself, every pass playing together in each iteration.

    function layerSegments(layer) {
      const bufferStart = layer.offset < 0 ? -layer.offset : 0; // seconds trimmed off the front
      const segs = [];
      let pos = Math.max(0, layer.offset);
      let bufOff = bufferStart;
      let remaining = layer.buffer.duration - bufferStart;
      while (remaining > 0.001) {
        const d = Math.min(remaining, loopLength - pos);
        segs.push({ pos, bufOff, dur: d });
        bufOff += d;
        remaining -= d;
        pos = 0;
      }
      return segs;
    }

    // Schedule one layer's segments from `fromOffset` (loop seconds) onward.
    // Segments already in progress at fromOffset are started mid-buffer.
    function scheduleLayerFrom(layer, iterationStart, fromOffset) {
      layerSegments(layer).forEach(seg => {
        if (seg.pos + seg.dur <= fromOffset + 0.001) return; // fully in the past
        const startPos = Math.max(seg.pos, fromOffset);
        const skip = startPos - seg.pos;
        const node = audioCtx.createBufferSource();
        node.buffer = layer.buffer;
        node.connect(layer.gain);
        node.start(Math.max(audioCtx.currentTime, iterationStart + startPos), seg.bufOff + skip, seg.dur - skip);
        activeNodes.push(node);
        node.onended = () => { const i = activeNodes.indexOf(node); if (i !== -1) activeNodes.splice(i, 1); };
      });
    }

    function scheduleIterationFrom(iterationStart, fromOffset) {
      layers.forEach(layer => scheduleLayerFrom(layer, iterationStart, fromOffset));
    }

    function startLoopIteration(startTime) {
      loopStartAudioTime = startTime;
      scheduleIterationFrom(startTime, 0);
      scheduleNextIteration(startTime);
    }

    function scheduleNextIteration(iterationStart) {
      const nextStart    = iterationStart + loopLength;
      const msUntilNext  = (nextStart - audioCtx.currentTime) * 1000 - 50; // 50ms early for precision

      nextLoopTimeout = setTimeout(() => {
        startLoopIteration(nextStart);
      }, Math.max(0, msUntilNext));
    }

    function stopAllNodes() {
      activeNodes.forEach(n => { try { n.onended = null; n.stop(); } catch (_) {} });
      activeNodes = [];
    }

    // ── Volume: per-layer sliders + automatic ducking as layers age ──────
    // Borrowed from PopThatLock's arranger: the newest layer stays foreground
    // and full; older layers duck progressively so they sit underneath.
    // The sliders are absolute: when a layer ducks, its slider moves down with
    // it, and dragging a slider sets that layer's actual level directly.

    function ageDuck(age) {
      return Math.max(0.35, Math.pow(0.78, age));
    }

    // Master (max volume) — the 0..100 slider maps to a 0..2 gain, so its 50%
    // default is exactly the loudness the app had before it existed.
    function masterFactor() {
      return masterVol * 2;
    }

    // Called when a new layer has just been pushed: step every older layer
    // down one age notch, keeping any manual slider tweaks proportionally.
    function duckOlderLayers() {
      const n = layers.length;
      layers.forEach((layer, i) => {
        if (i === n - 1) return; // the newest keeps its level
        const age = n - 1 - i;
        layer.effVol = Math.min(1, layer.effVol * ageDuck(age) / ageDuck(age - 1));
      });
    }

    function applyGains() {
      layers.forEach(layer => {
        if (layer.gain) layer.gain.gain.setTargetAtTime(layer.effVol, audioCtx.currentTime, 0.03);
        const pct = Math.round(layer.effVol * 100);
        if (layer.valEl) layer.valEl.textContent = pct + '%';
        if (layer.sliderEl) layer.sliderEl.value = String(pct);
      });
    }

    function renderMixer() {
      mixerEl.innerHTML = '';
      layers.forEach((layer, i) => {
        const color = LAYER_COLORS[i % LAYER_COLORS.length];

        const row = document.createElement('div');
        row.className = 'mix-row';

        const dot = document.createElement('div');
        dot.className = 'legend-dot';
        dot.style.background = color;

        const label = document.createElement('span');
        label.className = 'mix-label';
        label.textContent = 'Layer ' + (i + 1);

        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = '0';
        slider.max = '100';
        slider.value = String(Math.round(layer.effVol * 100));
        slider.style.accentColor = color;

        const val = document.createElement('span');
        val.className = 'mix-val';
        layer.valEl = val;
        layer.sliderEl = slider;

        slider.addEventListener('input', () => {
          layer.effVol = slider.value / 100;
          if (layer.gain) layer.gain.gain.setTargetAtTime(layer.effVol, audioCtx.currentTime, 0.03);
          val.textContent = Math.round(layer.effVol * 100) + '%';
        });
        slider.addEventListener('change', saveSession); // persist on release

        row.append(dot, label, slider, val);
        mixerEl.appendChild(row);
      });
    }

    // ── Ring visualization ────────────────────────────────────────────────
    // Concentric circles, one per layer: oldest innermost, newest outermost
    // (new rings slide in from outside; existing rings ease inward as they age).
    // Each ring shows its layer's waveform radially; the sweeping beam marks
    // playback progress around the loop, starting at 12 o'clock. The record
    // button sits in the hub at the centre.

    let vizRafId  = null;
    let vizLastTs = 0;

    function startViz() {
      if (vizRafId === null) {
        vizLastTs = 0;
        vizRafId = requestAnimationFrame(vizFrame);
      }
    }

    function stopViz() {
      if (vizRafId !== null) cancelAnimationFrame(vizRafId);
      vizRafId = null;
    }

    function vizFrame(ts) {
      vizRafId = requestAnimationFrame(vizFrame);
      const dt = vizLastTs ? Math.min(0.1, (ts - vizLastTs) / 1000) : 0.016;
      vizLastTs = ts;
      sampleMicLevel();
      drawViz(dt);
    }

    // Piggybacks on the render loop: tracks when the mic last carried sound so
    // the segment cutter can wait for a quiet moment.
    function sampleMicLevel() {
      if (!micAnalyser || !isRecording) return;
      micAnalyser.getFloatTimeDomainData(micData);
      let sum = 0;
      for (let i = 0; i < micData.length; i++) sum += micData[i] * micData[i];
      if (Math.sqrt(sum / micData.length) > 0.02) lastLoudAt = performance.now();
    }

    function hexA(hex, a) {
      const v = Math.max(0, Math.min(255, Math.round(a * 255)));
      return hex + v.toString(16).padStart(2, '0');
    }

    function buildPeaks(buffer) {
      const data   = buffer.getChannelData(0);
      const count  = 600; // fixed resolution cache
      const block  = Math.max(1, Math.floor(data.length / count));
      const peaks  = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        let max = 0;
        const end = Math.min((i + 1) * block, data.length);
        for (let j = i * block; j < end; j++) {
          const v = Math.abs(data[j]);
          if (v > max) max = v;
        }
        peaks[i] = max;
      }
      return peaks;
    }

    // Convert loop-clock angle (0 = top, clockwise) to a canvas-arc angle.
    const toArc = a => a - Math.PI / 2;

    function drawViz(dt) {
      const dpr  = window.devicePixelRatio || 1;
      const rect = vizCanvas.getBoundingClientRect();
      if (!rect.width) return; // not laid out yet

      const px = Math.round(rect.width * dpr);
      if (vizCanvas.width !== px || vizCanvas.height !== px) {
        vizCanvas.width  = px;
        vizCanvas.height = px;
      }

      const g  = vizCanvas.getContext('2d');
      const cW = px;
      const cx = cW / 2;
      const cy = cW / 2;

      g.clearRect(0, 0, cW, cW);

      const outerR = cW * 0.46;
      const hubR   = cW * 0.13;

      // Base plate
      const plate = g.createRadialGradient(cx, cy, hubR * 0.5, cx, cy, cW * 0.5);
      plate.addColorStop(0, '#161b26');
      plate.addColorStop(1, '#0c0f16');
      g.fillStyle = plate;
      g.beginPath();
      g.arc(cx, cy, cW * 0.495, 0, TAU);
      g.fill();

      // Outer bezel
      g.lineWidth = 2 * dpr;
      g.strokeStyle = 'rgba(120,140,170,0.35)';
      g.beginPath();
      g.arc(cx, cy, cW * 0.48, 0, TAU);
      g.stroke();

      // 12 o'clock index marker — where each loop iteration begins.
      g.strokeStyle = 'rgba(220,230,255,0.7)';
      g.lineWidth = 2 * dpr;
      g.beginPath();
      g.moveTo(cx, cy - outerR - 2 * dpr);
      g.lineTo(cx, cy - cW * 0.495);
      g.stroke();

      if (!layers.length || !loopLength) return; // idle: just the empty plate

      const span = outerR - hubR;
      const band = span / layers.length;
      const half = Math.min(band * 0.5, span * 0.16);

      // Ease each ring toward its age-based slot (new rings slide in from outside).
      const ease = Math.min(1, dt * 7);
      layers.forEach((layer, i) => {
        const targetR = hubR + band * (i + 0.5);
        if (layer.curR === null) {
          layer.curR    = outerR + half * 3;
          layer.curHalf = half;
        }
        layer.curR    += (targetR - layer.curR) * ease;
        layer.curHalf += (half - layer.curHalf) * ease;
      });

      // --- Rings: one per layer, waveform drawn radially around the circle. ---
      layers.forEach((layer, i) => {
        const color = LAYER_COLORS[i % LAYER_COLORS.length];
        const r = layer.curR;
        const maxHalf = layer.curHalf * 0.85;

        // Faint guide circle
        g.strokeStyle = hexA(color, 0.14);
        g.lineWidth = dpr;
        g.beginPath();
        g.arc(cx, cy, r, 0, TAU);
        g.stroke();

        if (!layer.peaks) {
          layer.peaks = buildPeaks(layer.buffer);
          let m = 0;
          for (let j = 0; j < layer.peaks.length; j++) if (layer.peaks[j] > m) m = layer.peaks[j];
          layer.peakMax = m;
        }
        const segs = layerSegments(layer);
        if (!segs.length || !layer.peakMax) return;

        // Ring brightness follows the layer's effective volume (slider × age duck).
        g.strokeStyle = hexA(color, 0.3 + 0.6 * layer.effVol);
        g.lineWidth = 1.4 * dpr;
        g.beginPath();
        const steps = Math.max(160, Math.min(720, Math.round((TAU * r) / (2.2 * dpr))));
        const bufDur = layer.buffer.duration;
        for (let k = 0; k < steps; k++) {
          const t = (k / steps) * loopLength;
          // A layer longer than the loop overlays itself; show the loudest pass.
          let peak = -1;
          for (const seg of segs) {
            if (t < seg.pos || t >= seg.pos + seg.dur) continue;
            const bt = seg.bufOff + (t - seg.pos);
            const idx = Math.min(layer.peaks.length - 1, Math.floor((bt / bufDur) * layer.peaks.length));
            if (layer.peaks[idx] > peak) peak = layer.peaks[idx];
          }
          if (peak < 0) continue; // this layer is silent here — leave the gap visible
          const amp = Math.max(0.05, peak / layer.peakMax);
          const a  = (k / steps) * TAU;
          const sa = Math.sin(a);
          const ca = Math.cos(a);
          const r0 = r - amp * maxHalf;
          const r1 = r + amp * maxHalf;
          g.moveTo(cx + sa * r0, cy - ca * r0);
          g.lineTo(cx + sa * r1, cy - ca * r1);
        }
        g.stroke();
      });

      // --- Recording arc: grows around the rim while the mic is live. ---
      if (isRecording) {
        const startA  = (recordingStartOffset / loopLength) * TAU;
        const elapsed = Math.min(1, (audioCtx.currentTime - recStartTime) / loopLength);
        g.strokeStyle = 'rgba(224,58,58,0.9)';
        g.lineWidth = 3 * dpr;
        g.beginPath();
        g.arc(cx, cy, cW * 0.48, toArc(startA), toArc(startA + elapsed * TAU), false);
        g.stroke();
      }

      // --- Sweep beam: fading trailing wedge + bright leading edge. ---
      const beam = (currentLoopOffset() / loopLength) * TAU;
      {
        const trail = TAU * 0.16;
        const grad = g.createRadialGradient(cx, cy, hubR, cx, cy, outerR);
        grad.addColorStop(0, 'rgba(170,210,255,0)');
        grad.addColorStop(1, 'rgba(170,210,255,0.10)');
        g.fillStyle = grad;
        g.beginPath();
        g.moveTo(cx, cy);
        g.arc(cx, cy, outerR, toArc(beam - trail), toArc(beam), false);
        g.closePath();
        g.fill();
      }
      {
        const tipX  = cx + Math.sin(beam) * outerR;
        const tipY  = cy - Math.cos(beam) * outerR;
        const rootX = cx + Math.sin(beam) * hubR * 0.9;
        const rootY = cy - Math.cos(beam) * hubR * 0.9;
        const lg = g.createLinearGradient(rootX, rootY, tipX, tipY);
        lg.addColorStop(0, 'rgba(200,225,255,0.15)');
        lg.addColorStop(1, 'rgba(225,240,255,0.95)');
        g.strokeStyle = lg;
        g.lineWidth = 2.5 * dpr;
        g.shadowBlur = 12 * dpr;
        g.shadowColor = 'rgba(200,225,255,0.9)';
        g.beginPath();
        g.moveTo(rootX, rootY);
        g.lineTo(tipX, tipY);
        g.stroke();
        g.shadowBlur = 0;
        // tip spark
        g.fillStyle = 'rgba(235,245,255,0.95)';
        g.beginPath();
        g.arc(tipX, tipY, 3 * dpr, 0, TAU);
        g.fill();
      }
    }

    // ── WAV export ────────────────────────────────────────────────────────

    function openExportDialog() {
      if (!loopLength || !layers.length) return;
      exportName.value = sessionName;
      exportFinalDesc.textContent =
        'The finished loop as it sounds now (' + loopLength.toFixed(1) + 's)';
      exportJourneyDesc.textContent =
        'The process — one loop per layer, arriving one at a time (' +
        (loopLength * layers.length).toFixed(1) + 's)';
      exportDialog.classList.add('open');
    }

    function closeExportDialog() {
      exportDialog.classList.remove('open');
    }

    // Render the mix offline. journey=false: one loop, all layers at today's
    // levels. journey=true: one loop per layer added — stage k plays layers
    // 0..k with the age-ducked levels they had when layer k was the newest,
    // recreating how the piece sounded as it was built.
    async function renderExport(journey) {
      const sampleRate   = audioCtx.sampleRate;
      const stages       = journey ? layers.length : 1;
      const totalSamples = Math.ceil(loopLength * stages * sampleRate);
      const offlineCtx   = new OfflineAudioContext(2, totalSamples, sampleRate);

      for (let s = 0; s < stages; s++) {
        const count      = journey ? s + 1 : layers.length;
        const stageStart = s * loopLength;
        for (let i = 0; i < count; i++) {
          const layer = layers[i];
          // Journey stages rescale each layer's current level back to the age
          // it had at that stage; everything passes through the max volume.
          const stageScale = journey
            ? ageDuck(count - 1 - i) / ageDuck(layers.length - 1 - i)
            : 1;
          const level = layer.effVol * stageScale * masterFactor();
          const gain = offlineCtx.createGain();
          gain.gain.value = level;
          gain.connect(offlineCtx.destination);
          layerSegments(layer).forEach(seg => {
            const node = offlineCtx.createBufferSource();
            node.buffer = layer.buffer;
            node.connect(gain);
            node.start(stageStart + seg.pos, seg.bufOff, seg.dur);
          });
        }
      }
      return offlineCtx.startRendering();
    }

    function sanitizeFilename(name) {
      return name.replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim();
    }

    async function downloadWav(journey) {
      // The name given here doubles as the session's name in History.
      const typed = exportName.value.trim();
      if (typed && typed !== sessionName) {
        sessionName = typed;
        saveSession();
      }
      const base = sanitizeFilename(typed || sessionName) || 'audio-layers';

      closeExportDialog();
      downloadBtn.textContent = 'Rendering…';
      downloadBtn.disabled = true;

      try {
        const rendered  = await renderExport(journey);
        const wavBlob   = audioBufferToWav(rendered);
        const url       = URL.createObjectURL(wavBlob);
        const a         = document.createElement('a');
        a.href          = url;
        a.download      = base + (journey ? '-journey' : '') + '.wav';
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        console.error(err);
        setStatus('Export failed. Try again.');
      } finally {
        downloadBtn.textContent = '⬇ Download WAV';
        downloadBtn.disabled = false;
      }
    }

    // ── WAV encoder ───────────────────────────────────────────────────────

    function audioBufferToWav(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate  = buffer.sampleRate;
      const format      = 1; // PCM
      const bitDepth    = 16;

      // Interleave channels
      const channelData = [];
      for (let c = 0; c < numChannels; c++) channelData.push(buffer.getChannelData(c));
      const interleaved = interleave(channelData, buffer.length, numChannels);

      const dataBytes = interleaved.length * 2; // 16-bit
      const wavBuffer = new ArrayBuffer(44 + dataBytes);
      const view      = new DataView(wavBuffer);

      writeString(view, 0,  'RIFF');
      view.setUint32( 4,  36 + dataBytes,  true);
      writeString(view, 8,  'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16,                              true);
      view.setUint16(20, format,                          true);
      view.setUint16(22, numChannels,                     true);
      view.setUint32(24, sampleRate,                      true);
      view.setUint32(28, sampleRate * numChannels * 2,    true); // byte rate
      view.setUint16(32, numChannels * 2,                 true); // block align
      view.setUint16(34, bitDepth,                        true);
      writeString(view, 36, 'data');
      view.setUint32(40, dataBytes, true);

      let offset = 44;
      for (let i = 0; i < interleaved.length; i++) {
        const s = Math.max(-1, Math.min(1, interleaved[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        offset += 2;
      }

      return new Blob([wavBuffer], { type: 'audio/wav' });
    }

    function interleave(channelData, length, numChannels) {
      const result = new Float32Array(length * numChannels);
      for (let i = 0; i < length; i++) {
        for (let c = 0; c < numChannels; c++) {
          result[i * numChannels + c] = channelData[c][i];
        }
      }
      return result;
    }

    function writeString(view, offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    // ── Helpers ───────────────────────────────────────────────────────────

    function setStatus(msg, isActive = false) {
      statusMsg.textContent = msg;
      statusMsg.className   = isActive ? 'active' : '';
    }

    // A newly recorded layer ages the others; a session loaded from history
    // restores its stored levels as-is.
    function updateLayerUI() {
      duckOlderLayers();
      refreshLayerUI();
    }

    function refreshLayerUI() {
      layerCountEl.style.display = '';
      layerNumEl.textContent     = layers.length;
      loopDurEl.textContent      = loopLength.toFixed(1);
      downloadBtn.style.display          = 'inline-block';
      secondaryControls.style.display    = 'flex';
      latencyControl.style.display       = 'flex';
      mixerDetails.classList.add('visible');
      mixerSummary.textContent           = 'Layer Volumes (' + layers.length + ')';
      renderMixer();
      applyGains();
    }

    function getSupportedMimeType() {
      const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/ogg', 'audio/mp4'];
      return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
    }

    // ── Button event handlers ─────────────────────────────────────────────
    // Push-to-talk: hold to record, release to stop.
    // Toggle (default): tap to start; after the first layer the app keeps
    // listening and adds a layer per loop when there's enough sound.

    let isHolding = false;

    function handleToggleTap() {
      if (isPaused || isDecoding) return;
      if (autoRec) {
        stopAutoSegments(true);
        return;
      }
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopRecording();
        return;
      }
      if (layers.length > 0) {
        startAutoSegments();
        return;
      }
      startRecording();
    }

    function onPressStart(e) {
      e.preventDefault();
      if (recordBtn.disabled) return;
      if (pushToTalk) {
        if (isDecoding) return;
        isHolding = true;
        startRecording();
      } else {
        handleToggleTap();
      }
    }

    function onPressEnd(e) {
      if (!pushToTalk || !isHolding) return;
      e.preventDefault();
      isHolding = false;
      stopRecording();
    }

    recordBtn.addEventListener('mousedown',  onPressStart);
    recordBtn.addEventListener('touchstart', onPressStart, { passive: false });
    document.addEventListener('mouseup',     onPressEnd);
    document.addEventListener('touchend',    onPressEnd,   { passive: false });

    // Prevent context menu on long-press (mobile)
    recordBtn.addEventListener('contextmenu', e => e.preventDefault());

    // ── History panel ─────────────────────────────────────────────────────

    function formatWhen(t) {
      return new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    async function renderHistory() {
      historyList.innerHTML = '';
      let records;
      try {
        records = await idbAll();
      } catch (err) {
        console.error(err);
        historyList.innerHTML = '<div class="hist-empty">History is unavailable in this browser.</div>';
        return;
      }
      records.sort((a, b) => b.updatedAt - a.updatedAt);
      if (!records.length) {
        historyList.innerHTML = '<div class="hist-empty">No recordings yet.</div>';
        return;
      }

      records.forEach(rec => {
        const row = document.createElement('div');
        row.className = 'hist-row';

        const main = document.createElement('div');
        main.className = 'hist-main';
        const nameEl = document.createElement('div');
        nameEl.className = 'hist-name';
        nameEl.textContent = rec.name || 'Untitled';
        const meta = document.createElement('div');
        meta.className = 'hist-meta';
        meta.textContent = formatWhen(rec.updatedAt) + ' · ' +
          rec.layers.length + ' layer' + (rec.layers.length === 1 ? '' : 's') +
          ' · ' + rec.loopLength.toFixed(1) + 's' +
          (rec.id === currentSessionId ? ' · current' : '');
        main.append(nameEl, meta);

        const renameBtn = document.createElement('button');
        renameBtn.className = 'hist-act';
        renameBtn.title = 'Rename';
        renameBtn.textContent = '✎';
        renameBtn.addEventListener('click', () => startRename(rec, nameEl));

        const loadBtn = document.createElement('button');
        loadBtn.className = 'hist-act';
        loadBtn.textContent = 'Load';
        loadBtn.addEventListener('click', () => loadSession(rec));

        const delBtn = document.createElement('button');
        delBtn.className = 'hist-act hist-del';
        delBtn.title = 'Delete';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', async () => {
          try { await idbDelete(rec.id); } catch (err) { console.error(err); }
          if (rec.id === currentSessionId) currentSessionId = null;
          renderHistory();
        });

        row.append(main, renameBtn, loadBtn, delBtn);
        historyList.appendChild(row);
      });
    }

    function startRename(rec, nameEl) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'hist-rename';
      input.maxLength = 60;
      input.value = rec.name || '';
      nameEl.replaceWith(input);
      input.focus();
      input.select();
      let done = false;
      const commit = async () => {
        if (done) return;
        done = true;
        rec.name = input.value.trim();
        try { await idbPut(rec); } catch (err) { console.error(err); }
        if (rec.id === currentSessionId) sessionName = rec.name;
        renderHistory();
      };
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape') { done = true; renderHistory(); }
      });
      input.addEventListener('blur', commit);
    }

    // Rebuild the whole session from a stored record and start playing it.
    async function loadSession(rec) {
      try {
        await ensureCtx(); // playback only — no mic needed until they record
        resetAll();
        loopLength = rec.loopLength;
        for (const sl of rec.layers) {
          const buffer = await audioCtx.decodeAudioData(await sl.blob.arrayBuffer());
          const gain = audioCtx.createGain();
          gain.connect(masterGain);
          layers.push({
            buffer,
            blob: sl.blob,
            rawOffset: sl.rawOffset,
            offset: sl.compensate ? applyCompensation(sl.rawOffset) : 0,
            compensate: sl.compensate,
            gain,
            effVol: sl.effVol,
            peaks: null,
            peakMax: 0,
            curR: null,
            curHalf: 0,
            valEl: null,
            sliderEl: null,
          });
        }
        currentSessionId = rec.id;
        sessionName = rec.name || '';
        refreshLayerUI();
        startLoopIteration(audioCtx.currentTime);
        historyPanel.classList.remove('open');
        setStatus(pushToTalk
          ? 'Loaded "' + (rec.name || 'Untitled') + '" — hold to add another layer'
          : 'Loaded "' + (rec.name || 'Untitled') + '" — tap to record more');
      } catch (err) {
        console.error(err);
        setStatus('Could not load that recording.');
      }
    }

    historyBtn.addEventListener('click', () => {
      settingsPanel.classList.remove('open');
      const opening = !historyPanel.classList.contains('open');
      historyPanel.classList.toggle('open');
      if (opening) renderHistory();
    });

    // ── Settings ──────────────────────────────────────────────────────────

    settingsBtn.addEventListener('click', () => {
      historyPanel.classList.remove('open');
      settingsPanel.classList.toggle('open');
    });

    pttToggle.addEventListener('change', () => {
      pushToTalk = pttToggle.checked;
      localStorage.setItem(LS_PTT, pushToTalk ? '1' : '0');
      if (pushToTalk && autoRec) stopAutoSegments(true);
      if (!isRecording && !isDecoding) updateIdleLabel();
    });

    rawMicToggle.addEventListener('change', () => {
      rawMic = rawMicToggle.checked;
      localStorage.setItem(LS_RAW, rawMic ? '1' : '0');
      if (autoRec) stopAutoSegments(true);
      // Swap the stream now if the mic is idle; otherwise after the recorder stops.
      micRefreshPending = true;
      refreshMicIfPending();
    });

    // ── Pause / Resume ────────────────────────────────────────────────────

    function pausePlayback() {
      if (!loopLength || isPaused) return;
      // Continuous recording can't run against a suspended clock — drop the
      // in-progress segment rather than committing audio with a bogus offset.
      if (autoRec) stopAutoSegments(false);
      pausedOffset = normOffset(audioCtx.currentTime - loopStartAudioTime);
      isPaused     = true;
      clearTimeout(nextLoopTimeout);
      // Stop scheduled nodes so resume can rebuild the iteration cleanly
      // (otherwise suspended nodes would fire again alongside the rescheduled ones).
      stopAllNodes();
      audioCtx.suspend();
      pauseBtn.textContent = '▶ Resume';
      pauseBtn.classList.add('paused');
      recordBtn.disabled = true;
      setStatus('Paused');
    }

    function resumePlayback() {
      if (!isPaused) return;
      audioCtx.resume().then(() => {
        isPaused = false;
        // Re-anchor the loop start so the current position matches pausedOffset,
        // then rebuild the iteration — layers that were mid-play resume partway.
        loopStartAudioTime = audioCtx.currentTime - pausedOffset;
        scheduleIterationFrom(loopStartAudioTime, pausedOffset);
        scheduleNextIteration(loopStartAudioTime);

        pauseBtn.textContent = '⏸ Pause';
        pauseBtn.classList.remove('paused');
        recordBtn.disabled = false;
        setStatus(pushToTalk
          ? 'Playing — hold to add another layer'
          : 'Playing — tap to record more');
      });
    }

    function togglePause() {
      isPaused ? resumePlayback() : pausePlayback();
    }

    // ── Reset ─────────────────────────────────────────────────────────────

    function resetAll() {
      // Stop continuous + any active recording, and abort one still in async setup
      startAborted = true;
      autoRec      = false;
      isRecording  = false;
      clearTimeout(segmentTimer);
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.onstop = null; // discard the recording
        mediaRecorder.stop();
      }
      isDecoding = false;

      // Stop loop scheduler
      clearTimeout(nextLoopTimeout);

      // Resume AudioContext in case it was suspended
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

      // Stop all playing nodes immediately and release per-layer gains
      stopAllNodes();
      layers.forEach(l => { try { l.gain.disconnect(); } catch (_) {} });

      // Clear all state. The session itself stays in History (auto-saved as
      // layers arrived); reset just detaches from it.
      layers.length     = 0;
      loopLength        = 0;
      loopStartAudioTime = null;
      isPaused          = false;
      pausedOffset      = 0;
      currentSessionId  = null;
      sessionName       = '';

      // Reset UI (the viz keeps running — it falls back to the idle plate)
      recordBtn.disabled       = false;
      recordBtn.classList.remove('recording');
      updateIdleLabel();
      pauseBtn.textContent     = '⏸ Pause';
      pauseBtn.classList.remove('paused');
      layerCountEl.style.display       = 'none';
      secondaryControls.style.display  = 'none';
      downloadBtn.style.display        = 'none';
      latencyControl.style.display     = 'none';
      mixerDetails.classList.remove('visible');
      mixerDetails.open                = false;
      mixerEl.innerHTML                = '';
      setStatus(pushToTalk
        ? 'Ready — hold the button to record your first layer'
        : 'Ready — tap the button to record your first layer');
    }

    // ── Download ──────────────────────────────────────────────────────────

    downloadBtn.addEventListener('click', openExportDialog);
    exportFinalBtn.addEventListener('click', () => downloadWav(false));
    exportJourneyBtn.addEventListener('click', () => downloadWav(true));
    exportCancel.addEventListener('click', closeExportDialog);
    exportDialog.addEventListener('click', e => {
      if (e.target === exportDialog) closeExportDialog();
    });

    pauseBtn.addEventListener('click', togglePause);
    resetBtn.addEventListener('click', resetAll);

    masterSlider.addEventListener('input', () => {
      masterVol = masterSlider.value / 100;
      masterVal.textContent = Math.round(masterVol * 100) + '%';
      if (masterGain) masterGain.gain.setTargetAtTime(masterFactor(), audioCtx.currentTime, 0.03);
    });

    latencySlider.addEventListener('input', () => {
      manualLatencyMs = parseInt(latencySlider.value, 10);
      latencyVal.textContent = (manualLatencyMs >= 0 ? '+' : '') + manualLatencyMs + ' ms';
      reapplyLatencyAndRestart();
    });

    // ── Headphone warning ─────────────────────────────────────────────────

    dismissWarning.addEventListener('click', () => {
      headphoneWarn.style.display = 'none';
    });

    // ── Boot ──────────────────────────────────────────────────────────────

    init();
  })();
  </script>
</body>
