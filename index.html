<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Layering</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 3rem;
    }

    /* ── Record button ── */
    #record-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3px solid #444;
      background: #1a1a22;
      color: #e0e0e0;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      -webkit-tap-highlight-color: transparent;
    }

    #record-btn:hover:not(:disabled) {
      border-color: #666;
    }

    #record-btn.recording {
      border-color: #e03a3a;
      background: #221a1a;
    }

    /* Pulsing ring while recording */
    #record-btn.recording::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid #e03a3a;
      animation: pulse 1.2s ease-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%   { opacity: 0.8; transform: scale(1); }
      100% { opacity: 0;   transform: scale(1.35); }
    }

    .btn-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #555;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    #record-btn.recording .btn-icon {
      background: #e03a3a;
      border-radius: 4px; /* square = recording indicator */
      width: 18px;
      height: 18px;
    }

    #record-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Status area ── */
    #status-area {
      margin-top: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      min-height: 4rem;
    }

    #layer-count {
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 0.05em;
    }

    #layer-count span {
      color: #e0e0e0;
      font-weight: 600;
    }

    #status-msg {
      font-size: 0.8rem;
      color: #555;
      letter-spacing: 0.05em;
      min-height: 1.1em;
    }

    #status-msg.active {
      color: #e03a3a;
    }

    /* ── Progress bar ── */
    #progress-wrap {
      width: 220px;
      height: 3px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 0.4rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #progress-wrap.visible {
      opacity: 1;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #4a8cf7;
      border-radius: 2px;
      transition: none;
    }

    /* ── Waveform display ── */
    #waveform-area {
      width: min(420px, calc(100vw - 3rem));
      margin-top: 1.5rem;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    #waveform-canvas {
      width: 100%;
      height: 80px;
      border-radius: 6px;
      display: block;
      border: 1px solid #2a2a35;
    }

    #waveform-legend {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      color: #777;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Secondary controls (pause / reset) ── */
    #secondary-controls {
      margin-top: 2.5rem;
      display: none;
      gap: 0.75rem;
    }

    .ctrl-btn {
      padding: 0.65rem 1.4rem;
      border: 1px solid #444;
      border-radius: 6px;
      background: transparent;
      color: #aaa;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    #pause-btn:hover {
      border-color: #f7c44a;
      color: #f7c44a;
      background: rgba(247, 196, 74, 0.06);
    }

    #pause-btn.paused {
      border-color: #f7c44a;
      color: #f7c44a;
    }

    #reset-btn:hover {
      border-color: #e03a3a;
      color: #e03a3a;
      background: rgba(224, 58, 58, 0.06);
    }

    /* ── Download button ── */
    #download-btn {
      margin-top: 0.75rem;
      padding: 0.65rem 1.6rem;
      border: 1px solid #444;
      border-radius: 6px;
      background: transparent;
      color: #aaa;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      display: none;
    }

    #download-btn:hover {
      border-color: #4a8cf7;
      color: #4a8cf7;
      background: rgba(74, 140, 247, 0.06);
    }

    /* ── Latency / timing offset control ── */
    #latency-control {
      margin-top: 1.75rem;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
    }

    #latency-control label {
      font-size: 0.72rem;
      color: #555;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .latency-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .latency-edge {
      font-size: 0.7rem;
      color: #444;
      width: 3em;
    }

    .latency-edge:last-of-type { text-align: right; }

    #latency-slider {
      width: 150px;
      accent-color: #4a8cf7;
      cursor: pointer;
    }

    #latency-val {
      font-size: 0.78rem;
      color: #888;
      min-width: 4.5em;
      text-align: center;
    }

    /* ── Headphone warning banner ── */
    #headphone-warning {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e28;
      border: 1px solid #3a3a50;
      border-radius: 8px;
      padding: 0.8rem 1.2rem;
      font-size: 0.78rem;
      color: #999;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      max-width: 340px;
      width: calc(100% - 2rem);
      line-height: 1.4;
    }

    #headphone-warning .icon { font-size: 1.2rem; flex-shrink: 0; }

    #dismiss-warning {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0 0 0 0.5rem;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    #dismiss-warning:hover { color: #999; }
  </style>
</head>
<body>

  <h1>Audio Layering</h1>

  <button id="record-btn" disabled>
    <div class="btn-icon"></div>
    <span id="btn-label">Hold to Record</span>
  </button>

  <div id="status-area">
    <div id="layer-count" style="display:none">
      Layers: <span id="layer-num">0</span>
      &nbsp;·&nbsp; Loop: <span id="loop-dur">0.0</span>s
    </div>
    <div id="status-msg">Initializing…</div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
  </div>

  <div id="waveform-area">
    <canvas id="waveform-canvas"></canvas>
    <div id="waveform-legend"></div>
  </div>

  <div id="secondary-controls">
    <button id="pause-btn" class="ctrl-btn">⏸ Pause</button>
    <button id="reset-btn" class="ctrl-btn">↺ Reset</button>
  </div>

  <button id="download-btn">&#8659; Download WAV</button>

  <div id="latency-control">
    <label for="latency-slider">Timing Offset</label>
    <div class="latency-row">
      <span class="latency-edge">-300ms</span>
      <input id="latency-slider" type="range" min="-300" max="300" step="5" value="0" />
      <span class="latency-edge">+300ms</span>
    </div>
    <span id="latency-val">0 ms</span>
  </div>

  <div id="headphone-warning">
    <span class="icon">🎧</span>
    <span>Use headphones to prevent playback from bleeding into your recording.</span>
    <button id="dismiss-warning" aria-label="Dismiss">✕</button>
  </div>

  <script>
  (() => {
    // ── DOM refs ──────────────────────────────────────────────────────────
    const recordBtn      = document.getElementById('record-btn');
    const btnLabel       = document.getElementById('btn-label');
    const statusMsg      = document.getElementById('status-msg');
    const layerCountEl   = document.getElementById('layer-count');
    const layerNumEl     = document.getElementById('layer-num');
    const loopDurEl      = document.getElementById('loop-dur');
    const progressWrap   = document.getElementById('progress-wrap');
    const progressBar    = document.getElementById('progress-bar');
    const downloadBtn       = document.getElementById('download-btn');
    const secondaryControls = document.getElementById('secondary-controls');
    const pauseBtn          = document.getElementById('pause-btn');
    const resetBtn          = document.getElementById('reset-btn');
    const waveformArea      = document.getElementById('waveform-area');
    const waveformCanvas    = document.getElementById('waveform-canvas');
    const waveformLegend    = document.getElementById('waveform-legend');
    const latencyControl    = document.getElementById('latency-control');
    const latencySlider     = document.getElementById('latency-slider');
    const latencyVal        = document.getElementById('latency-val');
    const headphoneWarn     = document.getElementById('headphone-warning');
    const dismissWarning    = document.getElementById('dismiss-warning');

    // ── Audio state ───────────────────────────────────────────────────────
    let audioCtx        = null;
    let mediaStream     = null;
    let mediaRecorder   = null;
    let recordedChunks  = [];

    // Each layer: { buffer: AudioBuffer, offset: number (seconds into loop) }
    const layers = [];

    // Playback loop state
    let loopLength          = 0;       // seconds
    let loopStartAudioTime  = null;    // AudioContext time when current iteration began
    let nextLoopTimeout     = null;
    let progressRafId       = null;

    // Flag: we're mid-decode after a recording stops
    let isDecoding = false;

    // Flag: user released the button before async setup finished
    let startAborted = false;

    // Waveform colours per layer
    const LAYER_COLORS = ['#4a8cf7', '#f7c44a', '#4af7a0', '#f74a8c', '#a44af7', '#f7714a'];

    // Latency compensation
    let manualLatencyMs = 0;

    // Pause state
    let isPaused       = false;
    let pausedOffset   = 0; // loop position (seconds) when paused

    // All live AudioBufferSourceNodes so we can stop them on reset
    let activeNodes = [];

    // ── Init ──────────────────────────────────────────────────────────────
    function init() {
      // Check basic browser support — everything else is set up lazily on first press
      // so the AudioContext is created inside a user gesture (required on mobile).
      if (!navigator.mediaDevices || !window.AudioContext && !window.webkitAudioContext) {
        setStatus('Your browser does not support Web Audio. Try Chrome or Safari.');
        return;
      }
      recordBtn.disabled = false;
      setStatus('Hold the button to record your first layer');
    }

    // Creates the AudioContext and mic stream the first time, always inside a
    // user-gesture handler so mobile browsers allow it.
    async function ensureReady() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
      if (!mediaStream) {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
          video: false
        });
      }
    }

    // ── Recording ─────────────────────────────────────────────────────────
    let recordingStartOffset = 0; // loop offset (seconds) at which recording began

    async function startRecording() {
      if (isDecoding) return;
      startAborted = false;

      // Set up AudioContext + mic inside the user gesture so mobile allows it.
      try {
        await ensureReady();
      } catch (err) {
        setStatus('Microphone access denied. Check permissions and try again.');
        console.error(err);
        return;
      }

      // User may have released the button while we were awaiting permissions.
      if (startAborted) return;

      // Capture offset within the current loop
      recordingStartOffset = loopLength > 0
        ? (audioCtx.currentTime - loopStartAudioTime) % loopLength
        : 0;

      recordedChunks = [];
      const mimeType = getSupportedMimeType();
      mediaRecorder = new MediaRecorder(mediaStream, mimeType ? { mimeType } : {});
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.start();

      recordBtn.classList.add('recording');
      btnLabel.textContent = 'Recording…';
      setStatus('Recording', true);
    }

    function stopRecording() {
      startAborted = true; // signal startRecording to bail if still in async setup
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

      recordBtn.classList.remove('recording');
      btnLabel.textContent = 'Processing…';
      recordBtn.disabled = true;
      setStatus('Processing…');
      isDecoding = true;

      mediaRecorder.onstop = async () => {
        try {
          const blob        = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
          const arrayBuf    = await blob.arrayBuffer();
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuf);

          // Store raw offset; compensation is applied dynamically so the slider works in real time.
          // compensate=true for all layers except the first (which has no reference to sync against).
          const shouldCompensate = loopLength > 0;
          const offset = shouldCompensate ? applyCompensation(recordingStartOffset) : 0;
          const layerEnd = offset + audioBuffer.duration;

          layers.push({ buffer: audioBuffer, rawOffset: recordingStartOffset, offset, compensate: shouldCompensate });
          updateLayerUI();

          if (loopLength === 0) {
            // First layer — establish loop length and start playback
            loopLength = audioBuffer.duration;
            startLoopIteration(audioCtx.currentTime);
          } else {
            // Schedule this layer immediately for the remainder of the current iteration
            scheduleLayerCurrentIteration({ buffer: audioBuffer, offset });

            if (layerEnd > loopLength) {
              // Extend loop: reschedule end-of-iteration timeout
              loopLength = layerEnd;
              rescheduleLoopEnd();
            }
          }

          setStatus('Playing — hold to add another layer');
          btnLabel.textContent = 'Hold to Record';
        } catch (err) {
          setStatus('Error processing audio. Try again.');
          btnLabel.textContent = 'Hold to Record';
          console.error(err);
        } finally {
          isDecoding = false;
          recordBtn.disabled = false;
        }
      };

      mediaRecorder.stop();
    }

    // ── Waveform rendering ────────────────────────────────────────────────

    function buildPeaks(buffer) {
      const data   = buffer.getChannelData(0);
      const count  = 600; // fixed resolution cache
      const block  = Math.max(1, Math.floor(data.length / count));
      const peaks  = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        let max = 0;
        const end = Math.min((i + 1) * block, data.length);
        for (let j = i * block; j < end; j++) {
          const v = Math.abs(data[j]);
          if (v > max) max = v;
        }
        peaks[i] = max;
      }
      return peaks;
    }

    function drawWaveforms() {
      if (!loopLength || !layers.length) return;

      const dpr  = window.devicePixelRatio || 1;
      const rect = waveformCanvas.getBoundingClientRect();
      const cssW = rect.width;
      const cssH = rect.height;

      // Element not laid out yet (e.g. just made visible) — retry after reflow
      if (cssW === 0 || cssH === 0) { requestAnimationFrame(drawWaveforms); return; }

      // Resize backing store if needed
      if (waveformCanvas.width !== Math.round(cssW * dpr) || waveformCanvas.height !== Math.round(cssH * dpr)) {
        waveformCanvas.width  = Math.round(cssW * dpr);
        waveformCanvas.height = Math.round(cssH * dpr);
      }

      const cW  = waveformCanvas.width;
      const cH  = waveformCanvas.height;
      const ctx = waveformCanvas.getContext('2d');

      ctx.clearRect(0, 0, cW, cH);

      // Background
      ctx.fillStyle = '#13131a';
      ctx.fillRect(0, 0, cW, cH);

      // Centre line
      ctx.strokeStyle = '#2e2e3e';
      ctx.lineWidth   = dpr;
      ctx.beginPath();
      ctx.moveTo(0, cH / 2);
      ctx.lineTo(cW, cH / 2);
      ctx.stroke();

      const midY   = cH / 2;
      const maxAmp = midY - 4 * dpr;

      // Build peaks caches and find global peak for normalisation
      let globalPeak = 0;
      layers.forEach(layer => {
        if (!layer.peaks) layer.peaks = buildPeaks(layer.buffer);
        for (let j = 0; j < layer.peaks.length; j++) {
          if (layer.peaks[j] > globalPeak) globalPeak = layer.peaks[j];
        }
      });
      if (globalPeak === 0) return;

      layers.forEach((layer, i) => {
        const color        = LAYER_COLORS[i % LAYER_COLORS.length];
        const rawOffsetPx  = (layer.offset / loopLength) * cW; // may be negative
        const layerTotalW  = (layer.buffer.duration / loopLength) * cW;

        // Clip drawing region to [0, cW]
        const drawStart = Math.max(0, rawOffsetPx);
        const drawEnd   = Math.min(cW, rawOffsetPx + layerTotalW);
        const drawWidth = drawEnd - drawStart;
        if (drawWidth <= 0) return; // off-screen entirely

        // Which fraction of the peaks array corresponds to [drawStart, drawEnd]
        const fracStart = (drawStart - rawOffsetPx) / layerTotalW;
        const fracEnd   = (drawEnd   - rawOffsetPx) / layerTotalW;

        ctx.fillStyle = color + 'bb'; // ~73% opacity

        for (let x = 0; x < Math.ceil(drawWidth); x++) {
          const frac = fracStart + (x / drawWidth) * (fracEnd - fracStart);
          const idx  = Math.min(Math.floor(frac * layer.peaks.length), layer.peaks.length - 1);
          const amplitude = (layer.peaks[idx] / globalPeak) * maxAmp;
          ctx.fillRect(drawStart + x, midY - amplitude, 1, amplitude * 2 || 1);
        }
      });

      // Legend
      waveformLegend.innerHTML = '';
      layers.forEach((_, i) => {
        const color = LAYER_COLORS[i % LAYER_COLORS.length];
        const item  = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `<div class="legend-dot" style="background:${color}"></div>Layer ${i + 1}`;
        waveformLegend.appendChild(item);
      });
    }

    // ── Latency helpers ───────────────────────────────────────────────────

    function applyCompensation(rawOffset) {
      const autoLatency = (audioCtx.baseLatency || 0) + (audioCtx.outputLatency || 0);
      const total = autoLatency + manualLatencyMs / 1000;
      return rawOffset - total; // may be negative; callers handle trimming
    }

    function reapplyLatencyAndRestart() {
      if (!loopLength || isPaused) return;

      // Recompute offsets for all compensated layers
      layers.forEach(layer => {
        if (layer.compensate) layer.offset = applyCompensation(layer.rawOffset);
      });

      // Stop currently playing nodes and restart from current loop position
      const currentOffset = (audioCtx.currentTime - loopStartAudioTime) % loopLength;
      activeNodes.forEach(n => { try { n.stop(); } catch (_) {} });
      activeNodes = [];
      clearTimeout(nextLoopTimeout);

      const now = audioCtx.currentTime;
      loopStartAudioTime = now - currentOffset;

      // Schedule any layers whose start time is still in the future this iteration
      layers.forEach(layer => {
        if (loopStartAudioTime + Math.max(0, layer.offset) > now) {
          scheduleLayerAt(layer, loopStartAudioTime);
        }
      });

      scheduleNextIteration(loopStartAudioTime);
    }

    // ── Playback loop scheduler ───────────────────────────────────────────

    function startLoopIteration(startTime) {
      loopStartAudioTime = startTime;

      // Schedule every layer
      layers.forEach(layer => scheduleLayerAt(layer, startTime));

      // Schedule next iteration
      scheduleNextIteration(startTime);
      startProgressAnimation();
    }

    function scheduleLayerAt(layer, iterationStart) {
      const bufferStart = layer.offset < 0 ? -layer.offset : 0; // seconds to skip into buffer
      const playAt      = iterationStart + Math.max(0, layer.offset);
      if (layer.buffer.duration - bufferStart <= 0) return; // fully trimmed, nothing to play

      const node = audioCtx.createBufferSource();
      node.buffer = layer.buffer;
      node.connect(audioCtx.destination);
      node.start(playAt, bufferStart);
      activeNodes.push(node);
      node.onended = () => { const i = activeNodes.indexOf(node); if (i !== -1) activeNodes.splice(i, 1); };
    }

    // Schedule a freshly-added layer for the *current* ongoing iteration
    function scheduleLayerCurrentIteration(layer) {
      const targetStart = loopStartAudioTime + Math.max(0, layer.offset);
      if (targetStart > audioCtx.currentTime) {
        scheduleLayerAt(layer, loopStartAudioTime);
      }
    }

    function scheduleNextIteration(iterationStart) {
      const nextStart    = iterationStart + loopLength;
      const msUntilNext  = (nextStart - audioCtx.currentTime) * 1000 - 50; // 50ms early for precision

      nextLoopTimeout = setTimeout(() => {
        startLoopIteration(nextStart);
      }, Math.max(0, msUntilNext));
    }

    // Called when loopLength is extended mid-iteration
    function rescheduleLoopEnd() {
      clearTimeout(nextLoopTimeout);
      scheduleNextIteration(loopStartAudioTime);
    }

    // ── Progress bar animation ─────────────────────────────────────────────

    function startProgressAnimation() {
      progressWrap.classList.add('visible');
      cancelAnimationFrame(progressRafId);

      function tick() {
        if (loopLength <= 0) return;
        const elapsed  = audioCtx.currentTime - loopStartAudioTime;
        const progress = Math.min((elapsed / loopLength) * 100, 100);
        progressBar.style.width = progress + '%';
        progressRafId = requestAnimationFrame(tick);
      }
      tick();
    }

    // ── WAV export ────────────────────────────────────────────────────────

    async function downloadWav() {
      downloadBtn.textContent = 'Rendering…';
      downloadBtn.disabled = true;

      try {
        const sampleRate    = audioCtx.sampleRate;
        const totalSamples  = Math.ceil(loopLength * sampleRate);
        const offlineCtx    = new OfflineAudioContext(2, totalSamples, sampleRate);

        layers.forEach(layer => {
          const bufferStart = layer.offset < 0 ? -layer.offset : 0;
          const playAt      = Math.max(0, layer.offset);
          if (layer.buffer.duration - bufferStart <= 0) return;
          const node = offlineCtx.createBufferSource();
          node.buffer = layer.buffer;
          node.connect(offlineCtx.destination);
          node.start(playAt, bufferStart);
        });

        const rendered  = await offlineCtx.startRendering();
        const wavBlob   = audioBufferToWav(rendered);
        const url       = URL.createObjectURL(wavBlob);
        const a         = document.createElement('a');
        a.href          = url;
        a.download      = 'audio-layers.wav';
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        console.error(err);
        setStatus('Export failed. Try again.');
      } finally {
        downloadBtn.textContent = '⬇ Download WAV';
        downloadBtn.disabled = false;
      }
    }

    // ── WAV encoder ───────────────────────────────────────────────────────

    function audioBufferToWav(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate  = buffer.sampleRate;
      const format      = 1; // PCM
      const bitDepth    = 16;

      // Interleave channels
      const channelData = [];
      for (let c = 0; c < numChannels; c++) channelData.push(buffer.getChannelData(c));
      const interleaved = interleave(channelData, buffer.length, numChannels);

      const dataBytes = interleaved.length * 2; // 16-bit
      const wavBuffer = new ArrayBuffer(44 + dataBytes);
      const view      = new DataView(wavBuffer);

      writeString(view, 0,  'RIFF');
      view.setUint32( 4,  36 + dataBytes,  true);
      writeString(view, 8,  'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16,                              true);
      view.setUint16(20, format,                          true);
      view.setUint16(22, numChannels,                     true);
      view.setUint32(24, sampleRate,                      true);
      view.setUint32(28, sampleRate * numChannels * 2,    true); // byte rate
      view.setUint16(32, numChannels * 2,                 true); // block align
      view.setUint16(34, bitDepth,                        true);
      writeString(view, 36, 'data');
      view.setUint32(40, dataBytes, true);

      let offset = 44;
      for (let i = 0; i < interleaved.length; i++) {
        const s = Math.max(-1, Math.min(1, interleaved[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        offset += 2;
      }

      return new Blob([wavBuffer], { type: 'audio/wav' });
    }

    function interleave(channelData, length, numChannels) {
      const result = new Float32Array(length * numChannels);
      for (let i = 0; i < length; i++) {
        for (let c = 0; c < numChannels; c++) {
          result[i * numChannels + c] = channelData[c][i];
        }
      }
      return result;
    }

    function writeString(view, offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    // ── Helpers ───────────────────────────────────────────────────────────

    function setStatus(msg, isActive = false) {
      statusMsg.textContent = msg;
      statusMsg.className   = isActive ? 'active' : '';
    }

    function updateLayerUI() {
      layerCountEl.style.display = '';
      layerNumEl.textContent     = layers.length;
      loopDurEl.textContent      = loopLength > 0 ? loopLength.toFixed(1) : (layers[layers.length - 1]?.buffer.duration.toFixed(1) ?? '0.0');
      downloadBtn.style.display          = 'inline-block';
      secondaryControls.style.display    = 'flex';
      latencyControl.style.display       = 'flex';
      waveformArea.style.display         = 'flex';
      drawWaveforms();
    }

    function getSupportedMimeType() {
      const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/ogg', 'audio/mp4'];
      return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
    }

    // ── Button event handlers ─────────────────────────────────────────────
    // Support both mouse and touch

    let isHolding = false;

    function onPressStart(e) {
      e.preventDefault();
      if (recordBtn.disabled || isDecoding) return;
      isHolding = true;
      startRecording();
    }

    function onPressEnd(e) {
      e.preventDefault();
      if (!isHolding) return;
      isHolding = false;
      stopRecording();
    }

    recordBtn.addEventListener('mousedown',  onPressStart);
    recordBtn.addEventListener('touchstart', onPressStart, { passive: false });
    document.addEventListener('mouseup',     onPressEnd);
    document.addEventListener('touchend',    onPressEnd,   { passive: false });

    // Prevent context menu on long-press (mobile)
    recordBtn.addEventListener('contextmenu', e => e.preventDefault());

    // ── Pause / Resume ────────────────────────────────────────────────────

    function pausePlayback() {
      if (!loopLength || isPaused) return;
      isPaused     = true;
      pausedOffset = (audioCtx.currentTime - loopStartAudioTime) % loopLength;
      clearTimeout(nextLoopTimeout);
      cancelAnimationFrame(progressRafId);
      audioCtx.suspend();
      pauseBtn.textContent = '▶ Resume';
      pauseBtn.classList.add('paused');
      recordBtn.disabled = true;
      setStatus('Paused');
    }

    function resumePlayback() {
      if (!isPaused) return;
      isPaused = false;
      audioCtx.resume().then(() => {
        // Re-anchor the loop start so the current position matches pausedOffset
        const now = audioCtx.currentTime;
        loopStartAudioTime = now - pausedOffset;

        // Schedule layers that haven't played yet in this iteration
        layers.forEach(layer => {
          if (Math.max(0, layer.offset) >= pausedOffset) {
            scheduleLayerAt(layer, loopStartAudioTime);
          }
        });

        // Schedule the end of this iteration
        scheduleNextIteration(loopStartAudioTime);
        startProgressAnimation();

        pauseBtn.textContent = '⏸ Pause';
        pauseBtn.classList.remove('paused');
        recordBtn.disabled = false;
        setStatus('Playing — hold to add another layer');
      });
    }

    function togglePause() {
      isPaused ? resumePlayback() : pausePlayback();
    }

    // ── Reset ─────────────────────────────────────────────────────────────

    function resetAll() {
      // Stop any active recording
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.onstop = null; // discard the recording
        mediaRecorder.stop();
      }
      isDecoding = false;

      // Stop loop scheduler
      clearTimeout(nextLoopTimeout);
      cancelAnimationFrame(progressRafId);

      // Resume AudioContext in case it was suspended
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

      // Stop all playing nodes immediately
      activeNodes.forEach(n => { try { n.stop(); } catch (_) {} });
      activeNodes = [];

      // Clear all state
      layers.length     = 0;
      loopLength        = 0;
      loopStartAudioTime = null;
      isPaused          = false;
      pausedOffset      = 0;

      // Reset UI
      recordBtn.disabled       = false;
      recordBtn.classList.remove('recording');
      btnLabel.textContent     = 'Hold to Record';
      pauseBtn.textContent     = '⏸ Pause';
      pauseBtn.classList.remove('paused');
      layerCountEl.style.display       = 'none';
      secondaryControls.style.display  = 'none';
      downloadBtn.style.display        = 'none';
      latencyControl.style.display     = 'none';
      waveformArea.style.display       = 'none';
      waveformLegend.innerHTML         = '';
      const wCtx = waveformCanvas.getContext('2d');
      wCtx.clearRect(0, 0, waveformCanvas.width, waveformCanvas.height);
      progressWrap.classList.remove('visible');
      progressBar.style.width  = '0%';
      setStatus('Ready — hold the button to record your first layer');
    }

    // ── Download ──────────────────────────────────────────────────────────

    downloadBtn.addEventListener('click', downloadWav);

    pauseBtn.addEventListener('click', togglePause);
    resetBtn.addEventListener('click', resetAll);

    latencySlider.addEventListener('input', () => {
      manualLatencyMs = parseInt(latencySlider.value, 10);
      latencyVal.textContent = (manualLatencyMs >= 0 ? '+' : '') + manualLatencyMs + ' ms';
      reapplyLatencyAndRestart();
      drawWaveforms();
    });

    // ── Headphone warning ─────────────────────────────────────────────────

    dismissWarning.addEventListener('click', () => {
      headphoneWarn.style.display = 'none';
    });

    // ── Boot ──────────────────────────────────────────────────────────────

    init();
  })();
  </script>
</body>
</html>
